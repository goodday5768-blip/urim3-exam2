#app{max-width:1200px;margin:0 auto}
.lock{padding:26px 16px;max-width:520px;margin:0 auto}.lock h1{font-size:25px;margin:6px 0;color:var(--h1)}.sub{color:var(--mute);font-size:16px;margin:0 0 14px}
.note{background:#fff;border-radius:18px;padding:18px;box-shadow:0 6px 22px rgba(10,90,70,.15)}
.btn{font:inherit;font-weight:800;border:0;background:#fff;color:var(--ink);border-radius:12px;padding:9px 14px;cursor:pointer}.pri{background:linear-gradient(120deg,var(--h1),var(--h2));color:#fff}
.hero{background:linear-gradient(125deg,#0e7c66,#2374e1 65%,#8a2be2);color:#fff;padding:30px 20px 26px;border-radius:0 0 26px 26px}.hero small{font-size:16px;font-weight:700}.hero h1{font-size:31px;line-height:1.25;margin:4px 0 8px}.hero p{margin:0;font-size:16.5px}
.home{padding:18px 14px 50px}.hh{font-size:20px;font-weight:900;margin:8px 4px 12px}.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.gc{display:block;text-decoration:none;color:#fff;border-radius:20px;padding:20px;box-shadow:0 8px 20px rgba(10,60,60,.2)}.gc b{display:block;font-size:26px;line-height:1.25}.gc span{font-size:16px;font-weight:600}
.res{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:14px 16px;margin:0 0 14px;font-weight:800;text-decoration:none;color:inherit}.res em{margin-left:auto;font-style:normal;color:var(--h1)}
.top{position:sticky;top:0;z-index:5;background:linear-gradient(120deg,var(--h1),var(--h2));color:#fff;display:flex;align-items:center;gap:10px;padding:9px 12px}.top b{font-size:20px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bk{background:rgba(255,255,255,.22);color:#fff;font-size:16px;padding:7px 12px;border-radius:11px;text-decoration:none;font-weight:800}.pn{font-size:15px;font-weight:700}
.top{display:block;padding:0}.tr{display:flex;align-items:center;gap:10px;padding:9px 12px}.tr b{font-size:20px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:7px;overflow-x:auto;padding:0 12px 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chips a{flex:none;font-size:15.5px;font-weight:800;cursor:pointer;color:#fff;background:rgba(255,255,255,.22);border-radius:999px;padding:5px 13px;white-space:nowrap}
main{padding:12px 8px 60px}article{background:#fff;border-radius:20px;margin:0 0 26px;overflow:hidden;box-shadow:0 8px 24px rgba(10,60,60,.16);scroll-margin-top:106px}

.sm{background:#fff6d8;border-bottom:3px solid #ffc53d;padding:13px 18px;font-size:20px;font-weight:700;line-height:1.55;color:#4a3500}.sm span{display:inline-block;background:#e8590c;color:#fff;font-size:15px;font-weight:900;border-radius:999px;padding:2px 12px;margin-right:8px;vertical-align:2px}

/* 콘텐츠 보호(2026-10-06) — 공용 조각(examapp/unlock.js). 빌더(content_crypt.inject)가 각 틀의 UNLOCK 표식 자리에 넣는다.
   D.enc = base64(iv + AES-256-GCM(gzip JSON)). 열쇠(16진수 64자)는 서버 start 응답 g.key 또는 이 기기에 저장된 값.

   st = {get(), set(v), del()} 열쇠 저장소(엔진마다 localStorage 이름공간이 달라 밖에서 준다). D.enc가 없는 옛 페이지는 그대로 통과.
   그림: <img data-enc="경로.bin"> 을 UNLOCK.lazy(root, cryptoKey)가 보일 때 받아 풀어 blob 주소로 넣는다(.bin이 아니면 그대로 src).
   음원(2026-11-02): <audio data-enc="경로.bin" data-type="audio/mp4"> 도 같은 방식(보일 때 받아 풀어 src). */
const UNLOCK = (() => {

  }
  async function open(keyHex, encB64) {
    const plain = await openBytes(await keyOf(keyHex), b64(encB64));
    const s = new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'));
    return JSON.parse(await new Response(s).text());
  }
  const MSG_NET = '처음 쓰는 기기는 인터넷 연결이 필요합니다. 통신 상태를 확인한 뒤 다시 시도하세요.';
  const MSG_SRV = '지금은 시작할 수 없습니다. 선생님께 문의하세요.';
  const MSG_FAIL = '내용을 여는 데 실패했습니다. 앱을 새로 고친 뒤 다시 시도하세요.';
  const MSG_OLD = '이 브라우저에서는 열 수 없습니다. 최신 Safari 또는 Chrome으로 여세요.';
  const able = () => !!(window.isSecureContext && window.crypto && crypto.subtle && typeof DecompressionStream !== 'undefined');
  async function run(D, g, st, target) {
    if (!D.enc) return {ok: true};
    if (!able()) return {ok: false, msg: MSG_OLD};
    const fresh = g && typeof g.key === 'string' && g.key.length === 64 ? g.key : '';
    const saved = st.get() || '';
    const tries = []; if (fresh) tries.push(fresh); if (saved && saved !== fresh) tries.push(saved);
    if (!tries.length) return {ok: false, msg: g && g.nokey ? MSG_SRV : MSG_NET};
    for (const k of tries) {
      try { const obj = await open(k, D.enc); Object.assign(target || D, obj); D.enc = ''; st.set(k); return {ok: true, key: k}; }
      catch (e) { if (k === saved) st.del(); }

  }
  const urls = new Map();   // 경로 → blob 주소(한 번 푼 그림은 다시 받지 않는다)
  async function imgUrl(key, path, type) {
    if (!key || !/\.bin$/.test(path)) return path;
    if (urls.has(path)) return urls.get(path);

      const r = await fetch(path); if (!r.ok) throw new Error('http ' + r.status);

  function lazy(root, key) {   // root 안의 img[data-enc]·audio[data-enc]를 화면에 보일 때 받아 넣는다
    const load = el => { if (el.dataset.done) return; el.dataset.done = '1'; const au = el.tagName === 'AUDIO';

  }

  const canon = b => SIGN_FIELDS.map(k => b[k] === undefined || b[k] === null ? '' : String(b[k])).join('|');

const $ = s => document.querySelector(s);

function chip(p, k) { const m = String(p.lab || '').match(/^(\S+(?:\s\d+)?)/); return m ? m[1] : k + 1; }
let memIO = null;
function saveMem() {   /* 큰 그림이라 화면에서 멀어진 쪽은 메모리에서 내렸다가 가까워지면 다시 넣는다(아이패드에서 한 범위 27쪽을 계속 내려도 안 튕기게) */

  memIO = new IntersectionObserver(es => es.forEach(e => { const im = e.target;
    if (e.isIntersecting) { if (im.dataset.u && !im.getAttribute('src')) im.src = im.dataset.u; }
